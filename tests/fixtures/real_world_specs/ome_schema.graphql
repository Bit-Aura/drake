type Query {
  "Device Discovery & Inventory Grouping"
  DeviceService_GetDevices(groupId: ID, ipAddress: String): [Device]
  GroupService_GetGroups(groupName: String): [DeviceGroup]
  
  "Compliance and Alerts management"
  AlertService_GetAlerts(severity: String, deviceId: ID): [Alert]
  JobService_GetJobs(status: String): [Job]
}

type Mutation {
  "Cross-product management orchestration workflows"
  DeviceService_DiscoverDevice(ipAddress: String!, credentialsId: ID!): DiscoveryJob
  GroupService_AddDeviceToGroup(deviceId: ID!, groupId: ID!): Boolean
  AlertService_AcknowledgeAlert(alertId: ID!): Boolean
}

type Device {
  id: ID!
  ipAddress: String
  healthStatus: String
  model: String
  serviceTag: String
}

type DeviceGroup {
  id: ID!
  name: String
  devices: [Device]
}

type Alert {
  id: ID!
  severity: String
  message: String
  deviceId: ID
}

type Job {
  id: ID!
  jobType: String
  status: String
}

type DiscoveryJob {
  jobId: ID!
  status: String
}
